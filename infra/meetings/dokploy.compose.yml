services:
  meeting-redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - meeting_redis_data:/data
    networks:
      - meeting-media
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    depends_on:
      - meeting-redis
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: meeting-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://api.inksphere.space/api/meeting/webhooks/livekit
        turn:
          enabled: true
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30100
    expose:
      - "7880"
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
      - target: 3478
        published: 3478
        protocol: udp
        mode: host
      - "30000-30100:30000-30100/udp"
    networks:
      - meeting-media
      - dokploy-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.00"
          memory: 2g

  # Room-composite recording. LiveKit itself cannot record: Egress is a separate worker that joins
  # the room headlessly, encodes it and uploads the MP4. Without this service a Record button exists
  # but every request fails, which is why Meetings__RecordingEnabled stays false until this is up.
  egress:
    image: livekit/egress:v1.12.0
    restart: unless-stopped
    depends_on:
      - meeting-redis
      - livekit
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: meeting-redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: false
        s3:
          access_key: ${OBJECT_STORAGE_ACCESS_KEY}
          secret: ${OBJECT_STORAGE_SECRET_KEY}
          region: ${OBJECT_STORAGE_REGION}
          endpoint: ${OBJECT_STORAGE_ENDPOINT}
          bucket: ${OBJECT_STORAGE_BUCKET}
          force_path_style: true
    # Chromium needs shared memory; the default 64MB causes silent renderer crashes mid-recording.
    shm_size: 1gb
    networks:
      - meeting-media
    deploy:
      replicas: 1
      resources:
        limits:
          # One 720p room-composite job per ~4 vCPU / 4 GB. Raise deliberately, and only with
          # capacity evidence — Phase 6 requires a declared ceiling, not an assumed one.
          cpus: "2.00"
          memory: 2g

volumes:
  meeting_redis_data:

networks:
  meeting-media:
  dokploy-network:
    external: true
