services:
  meeting-redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - meeting_redis_data:/data
    networks:
      - meeting-media
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    depends_on:
      - meeting-redis
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: meeting-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://api.inksphere.space/api/meeting/webhooks/livekit
        turn:
          enabled: true
          # Must match the TLS certificate Traefik serves for the TURN SNI router below.
          domain: turn.inksphere.space
          # Traefik terminates TLS on 443 and forwards plaintext to tls_port, so LiveKit must
          # NOT hold a certificate itself. What makes this subtle: with external_tls LiveKit still
          # advertises `tls_port` verbatim as the turns: candidate it hands to browsers. The number
          # here is therefore the port a client DIALS, not an internal one — set it to anything but
          # 443 and a UDP-blocked client is handed a candidate its own firewall rejects, which is
          # the exact failure this router exists to remove.
          # Binding 443 inside the container is only safe because livekit/livekit-server declares no
          # USER and runs as root (verified against the upstream Dockerfile, 2026-09-07). If a future
          # image drops to a non-root user this bind fails with "permission denied" at startup and
          # needs sysctl net.ipv4.ip_unprivileged_port_start=443 — cap_add alone will not fix it,
          # because Docker adds no ambient capabilities.
          external_tls: true
          tls_port: 443
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30100
    expose:
      - "7880"
      # Plaintext TURN/TLS target for the Traefik router. Never publish this to the host: it is
      # unencrypted, and it is only safe because Traefik is the sole thing that can reach it.
      - "443"
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
      - target: 3478
        published: 3478
        protocol: udp
        mode: host
      - "30000-30100:30000-30100/udp"
    networks:
      - meeting-media
      - dokploy-network
    deploy:
      replicas: 1
      # Traefik's Swarm provider reads labels from `deploy.labels`, not from a service-level
      # `labels:` block. If this stack is ever deployed with plain `docker compose` instead of as a
      # Swarm stack, these must move up to `labels:` on the service or Traefik will not see them
      # and TURN/TLS will silently stay unrouted while everything else keeps working.
      labels:
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        # A TCP router matching on SNI. It shares entrypoint 443 with the ordinary HTTP router for
        # livekit.inksphere.space; the two never collide because they match different SNI names.
        - traefik.tcp.routers.livekit-turn.rule=HostSNI(`turn.inksphere.space`)
        - traefik.tcp.routers.livekit-turn.entrypoints=websecure
        - traefik.tcp.routers.livekit-turn.tls=true
        - traefik.tcp.routers.livekit-turn.tls.certresolver=letsencrypt
        - traefik.tcp.routers.livekit-turn.service=livekit-turn
        - traefik.tcp.services.livekit-turn.loadbalancer.server.port=443
      resources:
        limits:
          cpus: "2.00"
          memory: 2g

  # Room-composite recording. LiveKit itself cannot record: Egress is a separate worker that joins
  # the room headlessly, encodes it and uploads the MP4. Without this service a Record button exists
  # but every request fails, which is why Meetings__RecordingEnabled stays false until this is up.
  egress:
    image: livekit/egress:v1.12.0
    restart: unless-stopped
    depends_on:
      - meeting-redis
      - livekit
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: meeting-redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: false
        s3:
          access_key: ${OBJECT_STORAGE_ACCESS_KEY}
          secret: ${OBJECT_STORAGE_SECRET_KEY}
          region: ${OBJECT_STORAGE_REGION}
          endpoint: ${OBJECT_STORAGE_ENDPOINT}
          bucket: ${OBJECT_STORAGE_BUCKET}
          force_path_style: true
    # Chromium needs shared memory; the default 64MB causes silent renderer crashes mid-recording.
    shm_size: 1gb
    networks:
      - meeting-media
    deploy:
      replicas: 1
      resources:
        limits:
          # One 720p room-composite job per ~4 vCPU / 4 GB. Raise deliberately, and only with
          # capacity evidence — Phase 6 requires a declared ceiling, not an assumed one.
          cpus: "2.00"
          memory: 2g

volumes:
  meeting_redis_data:

networks:
  meeting-media:
  dokploy-network:
    external: true
