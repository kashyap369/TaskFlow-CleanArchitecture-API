services:
  meeting-redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - meeting_redis_data:/data
    networks:
      - meeting-media
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    depends_on:
      - meeting-redis
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: meeting-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://api.inksphere.space/api/meeting/webhooks/livekit
        turn:
          enabled: true
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30100
    expose:
      - "7880"
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
      - target: 3478
        published: 3478
        protocol: udp
        mode: host
      - "30000-30100:30000-30100/udp"
    networks:
      - meeting-media
      - dokploy-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.00"
          memory: 2g

volumes:
  meeting_redis_data:

networks:
  meeting-media:
  dokploy-network:
    external: true
