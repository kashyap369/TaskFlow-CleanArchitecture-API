port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

# Single-node fallback for the Phase 0 smoke test on hosts without Docker. The normal local topology
# is compose.yml with Redis; do not use this standalone configuration as a production template.
keys:
  devkey: secretsecretsecretsecretsecretsecret

webhook:
  api_key: devkey
  urls:
    - http://localhost:5138/api/dev/meetings/livekit/webhook
