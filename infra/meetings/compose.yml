name: taskflow-meetings-phase0

services:
  redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/etc/livekit/livekit.yaml"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  egress:
    image: livekit/egress:v1.12.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    volumes:
      - ./egress.yaml:/etc/livekit/egress.yaml:ro
      - ../../TaskFlow.Api/App_Data/objects:/out
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
