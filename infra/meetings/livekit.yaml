port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

redis:
  address: redis:6379

# Development-only credentials. Production keys must come from secret management and must differ
# across development, staging and production.
keys:
  devkey: secretsecretsecretsecretsecretsecret

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:5138/api/dev/meetings/livekit/webhook
